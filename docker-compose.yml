services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mebel_catalog}
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-catalog_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-catalog} -d ${POSTGRES_DB:-mebel_catalog}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://catalog:catalog_password@db:5432/mebel_catalog}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-http://localhost:3000}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SUPER_ADMIN_TOKEN: ${SUPER_ADMIN_TOKEN:-}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      # Yuklangan rasmlar konteyner qayta ishga tushsa ham saqlanib qolishi uchun persistent volume.
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
