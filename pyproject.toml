[project]
name = "mebel-catalog-api"
version = "0.1.0"
description = "Multi-tenant furniture catalog API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy[asyncio]==2.0.51",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "alembic==1.18.5",
  "httpx>=0.28,<1",
  "segno>=1.6,<2"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "aiosqlite>=0.20,<1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
