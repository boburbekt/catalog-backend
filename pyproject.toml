[project]
name = "mebel-catalog-api"
version = "0.1.0"
description = "Multi-tenant furniture catalog API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy==2.0.51",
  "asyncpg>=0.30,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "alembic==1.18.5"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
